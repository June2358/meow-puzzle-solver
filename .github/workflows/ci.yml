name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Pixi environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.77.0
          cache: true

      - name: Run quality checks
        run: pixi run check
