[project]
name = "sudoku-solver"
version = "0.1.0"
description = "Sudoku solver and pygame visualizer"
authors = [{ name = "Lim Junmin", email = "dsgoat99@naver.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pygame-ce==2.5.8",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
]
web = [
    "pygbag==0.9.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "PERF"]
