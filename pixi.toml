[workspace]
authors = ["Lim Junmin <dsgoat99@naver.com>"]
channels = ["conda-forge"]
name = "MEOW"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
start = "python -X utf8 -m meow"
test = "python -m pytest -q"
lint = "ruff check ."
format-check = "ruff format --check ."
check = { depends-on = ["lint", "format-check", "test"] }

[dependencies]
python = ">=3.13,<3.15"
pygame-ce = ">=2.5.8,<3"
pytest = ">=9.1.1,<10"
ruff = ">=0.14.2,<1"
