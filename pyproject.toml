[project]
name = "meow-solver"
version = "0.1.0"
description = "고양이 테마 1-star Star Battle (Queens) 솔버와 시각화 앱"
authors = [{ name = "Lim Junmin", email = "dsgoat99@naver.com" }]
readme = "README.md"
requires-python = ">=3.12.15,<3.13"
dependencies = [
    "pygame-ce==2.5.8",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]
web = [
    "pygbag==0.9.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error"

[tool.ruff]
# 데스크톱과 Pygbag 브라우저의 Python 3.12 문법 호환성을 유지합니다.
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "PERF"]
