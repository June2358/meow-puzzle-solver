[project]
name = "puzzle-solvers"
version = "0.1.0"
description = "MEOW Queens and Sudoku solvers with shared pygame infrastructure"
authors = [{ name = "Lim Junmin", email = "dsgoat99@naver.com" }]
readme = "README.md"
requires-python = ">=3.12.15,<3.13"
dependencies = [
    "pygame-ce==2.5.8",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]
web = [
    "pygbag==0.9.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
pythonpath = [".", "tests/sudoku"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "PERF"]
